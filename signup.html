<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DermaCare - Sign Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/flowbite@2.5.2/dist/flowbite.min.js"></script>
</head>
<body class="bg-stone-50 text-gray-800">
<nav class="bg-white border-b border-stone-200"><div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
<a href="index.html" class="flex items-center gap-2"><span class="text-3xl">🌿</span><span class="text-2xl font-bold text-emerald-700">DermaCare</span></a>
<div class="flex flex-wrap items-center gap-6"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="signup.html" class="px-5 py-2.5 bg-emerald-700 text-white rounded-full">Sign Up</a><a href="signin.html" class="px-5 py-2.5 border border-emerald-700 text-emerald-700 rounded-full">Sign In</a></div>
</div></nav>

<section class="bg-emerald-900 text-white text-center py-16"><h1 class="text-4xl font-bold">Create Your Account</h1><p class="text-emerald-100 mt-3">Start your personalized skincare journey.</p></section>

<section class="max-w-lg mx-auto px-6 py-16"><div class="bg-white border rounded-2xl shadow-sm p-8">
<h2 class="text-2xl font-bold mb-6">Sign Up</h2>
<form class="space-y-5">
<div><label for="name" class="block mb-2 font-medium">Full Name</label><input type="text" id="name" required minlength="2" placeholder="Enter your full name" class="w-full p-3 border rounded-lg"></div>
<div><label for="email" class="block mb-2 font-medium">Email Address</label><input type="email" id="email" required placeholder="you@example.com" class="w-full p-3 border rounded-lg"></div>
<div><label for="password" class="block mb-2 font-medium">Password</label><input type="password" id="password" required minlength="8" placeholder="Minimum 8 characters" class="w-full p-3 border rounded-lg"></div>
<div><label for="skin" class="block mb-2 font-medium">Skin Type</label><select id="skin" required class="w-full p-3 border rounded-lg"><option value="">Select your skin type</option><option>Oily</option><option>Dry</option><option>Combination</option></select></div>
<button type="submit" class="w-full bg-emerald-700 text-white py-3 rounded-lg font-semibold hover:bg-emerald-800">Create Account</button>
</form>
<p class="text-center text-gray-600 mt-6">Already have an account? <a href="signin.html" class="text-emerald-700 font-semibold hover:underline">Sign in.</a></p>
</div></section>

<footer class="bg-gray-900 text-gray-300"><div class="max-w-7xl mx-auto px-6 py-10 text-center"><h2 class="text-xl font-bold text-white">DermaCare</h2><p class="mt-3">Personalized skincare made simple.</p></div><div class="border-t border-gray-700 text-center py-5">© 2026 DermaCare. All rights reserved.</div></footer>
</body>
</html>
